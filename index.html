<!doctype html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="L'Empire Barber — coupes, dégradés, barbe et rasage à la serviette chaude. Réservation en ligne." />
    <link rel="icon" type="image/svg+xml" href="/crown.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>L'Empire Barber</title>
    <script>
      // apply the saved or system theme before first paint
      try {
        var t = localStorage.getItem("lempire_theme");
        if (t !== "light") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-dvh bg-bg font-sans text-text antialiased print:overflow-visible print:bg-white selection:bg-gold selection:text-onaccent">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
